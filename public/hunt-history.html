<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hunt History</title>
  <link rel="stylesheet" href="/hunt-history.css" />
</head>

<body>
  <main class="app">
    <header class="page-header">
      <div>
        <a class="back-link" href="/">Alien Hunt</a>
        <h1>Hunt history</h1>
      </div>
      <a class="button secondary" href="/replay">enter hunt id</a>
    </header>

    <section id="summaryCards" class="summary-grid" aria-label="Hunt summary"></section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Hunts</h2>
        </div>
        <button id="refreshButton" type="button">refresh</button>
      </div>

      <p id="message" class="message" role="status"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Hunt ID</th>
              <th>Outcome</th>
              <th>Difficulty</th>
              <th>Alien Strategy</th>
              <th>Player Moves</th>
              <th>Alien Moves</th>
              <th>Shots</th>
              <th>Tracker Uses</th>
              <th>Started</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="historyRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/hunt-history.js"></script>
</body>

</html>
