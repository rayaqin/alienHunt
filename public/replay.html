<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alien Hunt Replay</title>
  <link rel="stylesheet" href="/replay.css" />
</head>

<body>
  <main class="app">
    <section id="setupView" class="panel">
      <header class="setup-header">
        <a class="back-link" href="/">Alien Hunt</a>
        <h1>Replay</h1>
        <p class="meta">Enter a completed hunt's id to replay its grid snapshots.</p>
      </header>

      <form id="replayForm" class="hunt-form">
        <input id="huntIdInput" name="huntId" type="text" placeholder="huntId" autocomplete="off" required />
        <button id="loadReplayButton" type="submit">replay</button>
      </form>

      <p id="setupMessage" class="message" role="status"></p>
    </section>

    <section id="replayView" class="panel hidden">
      <div class="replay-header">
        <div>
          <h1>Replay</h1>
          <p id="replayMeta" class="meta"></p>
        </div>
        <button id="cancelButton" type="button" class="secondary">cancel</button>
      </div>

      <canvas id="replayCanvas" width="400" height="400"></canvas>

      <div class="controls">
        <button id="previousButton" type="button">previous</button>
        <button id="pauseButton" type="button">pause</button>
        <button id="nextButton" type="button">next</button>
        <button id="replayButton" type="button">restart</button>
      </div>

      <p id="snapshotLabel" class="meta"></p>
    </section>
  </main>

  <script src="/replay.js"></script>
</body>

</html>
